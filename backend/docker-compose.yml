services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - DATABASE_URL=postgresql+asyncpg://smarttrip:smarttrip_secret@db:5432/smarttrip_db
      - APP_ENV=development
      - CORS_ORIGINS=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=smarttrip
      - POSTGRES_PASSWORD=smarttrip_secret
      - POSTGRES_DB=smarttrip_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarttrip -d smarttrip_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
