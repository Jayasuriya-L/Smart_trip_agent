version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=smarttrip
      - POSTGRES_PASSWORD=smarttrip_secret
      - POSTGRES_DB=smarttrip_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarttrip -d smarttrip_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Python FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    restart: always

  # 3. Next.js 14 Frontend
  frontend:
    build:
      context: ./smarttrip-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
